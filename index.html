<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GHOST GATE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Supabase JS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* =====================================================
   ROOT & BASE STYLES
===================================================== */
:root{
    --bg:#050809;
    --bg2:#0b1112;
    --card:rgba(255,255,255,.035);
    --text:#f4f8f8;
    --muted:#849292;
    --cyan:#19e6d2;
    --cyan-light:#83fff4;
    --border:rgba(25,230,210,.22);
    --silver:#c8d0d2;
    --gold:#e8bd55;
    --diamond:#70dfff;
    --danger:#ff5f70;
    --success:#35e6a1;
    --shadow:0 30px 90px rgba(0,0,0,.5);
    --ease:.35s cubic-bezier(.2,.8,.2,1);
}

body.light{
    --bg:#edf6f5;
    --bg2:#ffffff;
    --card:rgba(0,0,0,.035);
    --text:#111817;
    --muted:#647473;
    --cyan:#00a99d;
    --cyan-light:#00cfc0;
    --border:rgba(0,169,157,.22);
}

*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:"Vazirmatn",sans-serif;overflow-x:hidden;transition:.5s;}
button,input,textarea{font-family:inherit;}
button{cursor:pointer;}
a{text-decoration:none;color:inherit;}

.container{width:min(1200px,90%);margin:auto;}
.section{padding:110px 0;}

/* HEADER */
header{
    position:fixed;top:15px;left:50%;transform:translateX(-50%);
    width:min(1200px,94%);z-index:1000;padding:14px 20px;
    border:1px solid var(--border);border-radius:17px;
    background:rgba(5,10,11,.65);backdrop-filter:blur(22px);
    display:flex;align-items:center;justify-content:space-between;
    direction:ltr;transition:var(--ease);
}
body.light header{background:rgba(255,255,255,.72);}
.logo{display:flex;align-items:center;gap:11px;}
.logo-symbol{
    width:39px;height:39px;border:1px solid var(--cyan);border-radius:50%;
    display:grid;place-items:center;color:var(--cyan);
    font-family:"Cormorant Garamond",serif;font-size:17px;
    box-shadow:0 0 22px rgba(25,230,210,.15);
}
.logo-text{font-family:"Cormorant Garamond",serif;font-size:23px;letter-spacing:2px;}
.header-actions{display:flex;align-items:center;gap:10px;}
.icon-btn{
    width:40px;height:40px;border:none;background:transparent;
    color:var(--text);display:grid;place-items:center;
    position:relative;transition:var(--ease);
}
.icon-btn:hover{color:var(--cyan);transform:translateY(-2px);}
.cart-count{
    position:absolute;top:1px;right:0;min-width:17px;height:17px;
    padding:0 4px;border-radius:20px;background:var(--cyan);
    color:#001411;font-size:9px;font-weight:700;display:grid;place-items:center;
}

/* HERO */
.hero{
    min-height:100vh;position:relative;overflow:hidden;
    display:flex;align-items:center;
    background:radial-gradient(circle at 30% 50%,rgba(25,230,210,.10),transparent 30%);
}
.hero-title{position:absolute;right:8%;top:50%;transform:translateY(-50%);z-index:5;direction:ltr;text-align:right;}
.hero-title h1{
    font-family:"Cormorant Garamond",serif;font-size:clamp(70px,9vw,145px);
    line-height:.77;font-weight:400;letter-spacing:-5px;color:var(--text);
    transition:.5s;text-shadow:0 0 35px rgba(25,230,210,.08);
}
.hero-title h1:hover{color:var(--cyan);text-shadow:0 0 45px rgba(25,230,210,.25);}

/* PRODUCTS */
.section-heading{margin-bottom:45px;}
.eyebrow{color:var(--cyan);font-size:10px;letter-spacing:2px;margin-bottom:10px;}
.section-title{font-size:45px;font-weight:500;}
.products{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.product-card{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--card);transition:var(--ease);position:relative;}
.product-card:hover{transform:translateY(-8px);box-shadow:var(--shadow);}
.product-card.silver{--product-color:var(--silver);}
.product-card.gold{--product-color:var(--gold);}
.product-card.diamond{--product-color:var(--diamond);}

.product-image{
    height:280px;position:relative;overflow:hidden;display:grid;place-items:center;
    background:radial-gradient(circle,color-mix(in srgb,var(--product-color) 16%,transparent),transparent 58%);
}
.fake-product{
    width:150px;height:210px;border-radius:20px;
    background:linear-gradient(145deg,#273434,#020606);
    border:1px solid var(--product-color);display:grid;place-items:center;
    color:var(--product-color);font-family:"Cormorant Garamond",serif;font-size:25px;
}
.product-info{padding:23px;border-top:1px solid var(--border);}
.product-info h3{font-size:20px;font-weight:500;}
.product-price{color:var(--product-color,var(--cyan));margin-top:8px;font-size:14px;font-weight:700;}
.product-actions{display:flex;gap:9px;margin-top:18px;}
.add-cart{
    flex:1;padding:12px;border:1px solid var(--product-color,var(--cyan));
    border-radius:6px;background:rgba(25,230,210,.08);color:var(--product-color,var(--cyan));
    font-weight:700;transition:var(--ease);
}
.add-cart:hover{background:var(--product-color,var(--cyan));color:#001412;}

/* MODALS & OVERLAYS */
.modal-overlay,.cart-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.75);
    backdrop-filter:blur(10px);z-index:2000;opacity:0;
    visibility:hidden;transition:.35s;
}
.modal-overlay.active,.cart-overlay.active{opacity:1;visibility:visible;}

.account-modal,.cart-drawer{
    background:var(--bg2);border:1px solid var(--border);
    position:fixed;z-index:2200;transition:.35s;
}
.account-modal{
    width:min(420px,90%);border-radius:15px;padding:35px;
    top:50%;left:50%;transform:translate(-50%,-45%) scale(.96);
}
.modal-overlay.active .account-modal{transform:translate(-50%,-50%) scale(1);}

.cart-drawer{
    top:0;right:0;width:min(450px,94%);height:100vh;
    transform:translateX(100%);display:flex;flex-direction:column;
}
.cart-drawer.active{transform:translateX(0);}
.cart-header{padding:20px;display:flex;justify-content:space-between;border-bottom:1px solid var(--border);}
.cart-items{flex:1;overflow-y:auto;padding:20px;}
.cart-footer{padding:20px;border-top:1px solid var(--border);}

.form-group{margin-bottom:17px;}
.form-group label{display:block;font-size:11px;color:var(--muted);margin-bottom:8px;}
.form-group input,.form-group textarea{
    width:100%;padding:12px;border:1px solid var(--border);
    border-radius:6px;background:var(--card);color:var(--text);outline:none;
}
.account-submit,.checkout-btn{
    width:100%;padding:14px;border:1px solid var(--cyan);
    border-radius:6px;background:var(--cyan);color:#001412;font-weight:700;
}

/* CHAT & DASHBOARD */
.chat-box{
    height:250px;overflow-y:auto;border:1px solid var(--border);
    border-radius:8px;padding:12px;margin-bottom:12px;background:rgba(0,0,0,.2);
}
.chat-msg{margin-bottom:8px;padding:8px 12px;border-radius:6px;font-size:12px;max-width:80%;}
.chat-msg.customer{background:rgba(25,230,210,.15);margin-right:auto;border-right:2px solid var(--cyan);}
.chat-msg.admin{background:rgba(255,255,255,.08);margin-left:auto;border-left:2px solid var(--gold);}

/* TOAST */
.toast{
    position:fixed;bottom:25px;left:50%;transform:translateX(-50%) translateY(30px);
    background:var(--bg2);border:1px solid var(--cyan);color:var(--text);
    padding:12px 24px;border-radius:7px;z-index:6000;opacity:0;pointer-events:none;transition:.35s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>

<body>

<!-- HEADER -->
<header>
    <div class="logo">
        <div class="logo-symbol">GG</div>
        <div class="logo-text">GHOST GATE</div>
    </div>
    <div class="header-actions">
        <button class="icon-btn" id="openCartBtn">
            🛒 <span class="cart-count" id="cartCount">0</span>
        </button>
        <button class="icon-btn" id="openAccountBtn">👤</button>
    </div>
</header>

<!-- HERO -->
<section class="hero">
    <div class="hero-title">
        <h1>GHOST GATE</h1>
    </div>
</section>

<!-- PRODUCTS -->
<section class="section container">
    <div class="section-heading">
        <div class="eyebrow">PREMIUM VPN SERVICES</div>
        <div class="section-title">اشتراک‌های اصلی</div>
    </div>
    <div class="products" id="productsContainer">
        <!-- به صورت دینامیک از Supabase بارگذاری می‌شود -->
    </div>
</section>

<!-- CART DRAWER -->
<div class="cart-overlay" id="cartOverlay"></div>
<div class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
        <h2>سبد خرید شما</h2>
        <button class="icon-btn" id="closeCartBtn">✕</button>
    </div>
    <div class="cart-items" id="cartItems">
        <div style="text-align:center;padding:50px;color:var(--muted)">سبد خرید خالی است</div>
    </div>
    <div class="cart-footer">
        <div class="form-group">
            <label>آیدی تلگرام (جهت تحویل و پشتیبانی):</label>
            <input type="text" id="telegramHandleInput" placeholder="@username">
        </div>
        <button class="checkout-btn" id="submitOrderBtn">تکمیل و ثبت سفارش</button>
    </div>
</div>

<!-- ACCOUNT MODAL -->
<div class="modal-overlay" id="accountOverlay">
    <div class="account-modal">
        <button class="icon-btn" id="closeAccountBtn" style="position:absolute;left:15px;top:15px;">✕</button>
        
        <!-- Auth Form -->
        <div id="authFormSection">
            <h2 id="authTitle">ورود / ثبت نام</h2>
            <p style="color:var(--muted);font-size:12px;margin-bottom:20px;">برای خرید و دسترسی به چت پشتیبانی وارد شوید.</p>
            <div class="form-group">
                <label>ایمیل:</label>
                <input type="email" id="authEmail" placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>رمز عبور:</label>
                <input type="password" id="authPassword" placeholder="******">
            </div>
            <button class="account-submit" id="authSubmitBtn">ورود / ایجاد اکانت</button>
        </div>

        <!-- User Panel -->
        <div id="userPanelSection" style="display:none;">
            <h2>پنل کاربری</h2>
            <p style="color:var(--muted);font-size:12px;margin-bottom:15px;" id="userEmailDisplay"></p>
            
            <hr style="border-color:var(--border);margin:15px 0;">
            
            <h4 style="margin-bottom:10px;">پیگیری سفارش و چت آنلاین</h4>
            <div id="ordersList" style="max-height:120px;overflow-y:auto;margin-bottom:10px;"></div>
            
            <div class="chat-box" id="chatLog">
                <div style="text-align:center;color:var(--muted);font-size:11px;">یک سفارش را برای مشاهده چت انتخاب کنید</div>
            </div>
            <div style="display:flex;gap:5px;">
                <input type="text" id="chatMsgInput" placeholder="پیام خود را بنویسید..." style="flex:1;padding:8px;border-radius:4px;border:1px solid var(--border);background:var(--card);color:var(--text);">
                <button id="sendChatBtn" style="padding:8px 12px;border:1px solid var(--cyan);background:var(--cyan);color:#000;border-radius:4px;font-weight:700;">ارسال</button>
            </div>
            
            <button id="logoutBtn" style="width:100%;margin-top:20px;padding:10px;background:transparent;border:1px solid var(--danger);color:var(--danger);border-radius:5px;">خروج از حساب</button>
        </div>
    </div>
</div>

<div class="toast" id="toast">اعلان</div>

<!-- SUPABASE INTEGRATION SCRIPT -->
<script>
// =====================================================
// 1. SUPABASE INITIALIZATION
// =====================================================
const SUPABASE_URL = "https://tyexaqfkzfssfvdephmj.supabase.co/rest/v1/"; // آدرس Supabase خود را وارد کنید
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR5ZXhhcWZremZzc2Z2ZGVwaG1qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3Mjc1NDAsImV4cCI6MjEwMjMwMzU0MH0.BtDu-CTv7gKtwB4GWpOn5HfWDDZaIe9yXEUu9h_9wiA"; // کلید Anon خود را وارد کنید

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// State Application
let currentUser = null;
let cart = [];
let selectedOrderId = null;
let chatSubscription = null;

// UI Elements
const toast = document.getElementById("toast");
function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 3000);
}

// =====================================================
// 2. AUTHENTICATION LOGIC
// =====================================================
async function handleAuth() {
    const email = document.getElementById("authEmail").value.trim();
    const password = document.getElementById("authPassword").value.trim();

    if (!email || !password) return showToast("لطفا ایمیل و رمز عبور را وارد کنید");

    // سعی برای ورود
    let { data, error } = await supabase.auth.signInWithPassword({ email, password });

    if (error) {
        // اگر اکانت وجود نداشت، ثبت نام انجام می‌شود
        const signUpRes = await supabase.auth.signUp({ email, password });
        if (signUpRes.error) {
            showToast("خطا: " + signUpRes.error.message);
        } else {
            showToast("حساب کاربری ایجاد شد! وارد شدید.");
            checkUser();
        }
    } else {
        showToast("با موفقیت وارد شدید.");
        checkUser();
    }
}

async function checkUser() {
    const { data: { user } } = await supabase.auth.getUser();
    currentUser = user;

    if (user) {
        document.getElementById("authFormSection").style.display = "none";
        document.getElementById("userPanelSection").style.display = "block";
        document.getElementById("userEmailDisplay").textContent = user.email;
        loadUserOrders();
    } else {
        document.getElementById("authFormSection").style.display = "block";
        document.getElementById("userPanelSection").style.display = "none";
    }
}

document.getElementById("authSubmitBtn").addEventListener("click", handleAuth);
document.getElementById("logoutBtn").addEventListener("click", async () => {
    await supabase.auth.signOut();
    currentUser = null;
    checkUser();
    showToast("از حساب خارج شدید.");
});

// =====================================================
// 3. PRODUCTS & CART
// =====================================================
async function loadProducts() {
    const { data: products, error } = await supabase.from('products').select('*');
    const container = document.getElementById("productsContainer");
    
    if (error || !products) {
        container.innerHTML = "<p>خطا در دریافت لیست محصولات</p>";
        return;
    }

    container.innerHTML = products.map(p => `
        <div class="product-card ${p.id}">
            <div class="product-image">
                <div class="fake-product">${p.title.split(' ')[1] || 'GG'}</div>
            </div>
            <div class="product-info">
                <h3>${p.title}</h3>
                <div class="product-price">${Number(p.price).toLocaleString()} تومان</div>
                <div class="product-actions">
                    <button class="add-cart" onclick="addToCart('${p.id}', '${p.title}', ${p.price})">افزودن به سبد خرید</button>
                </div>
            </div>
        </div>
    `).join('');
}

function addToCart(id, title, price) {
    cart.push({ id, title, price });
    updateCartUI();
    showToast(`${title} به سبد خرید اضافه شد.`);
}

function updateCartUI() {
    document.getElementById("cartCount").textContent = cart.length;
    const itemsContainer = document.getElementById("cartItems");

    if (cart.length === 0) {
        itemsContainer.innerHTML = '<div style="text-align:center;padding:50px;color:var(--muted)">سبد خرید خالی است</div>';
        return;
    }

    let total = cart.reduce((sum, item) => sum + item.price, 0);
    itemsContainer.innerHTML = cart.map((item, index) => `
        <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);">
            <div>
                <div>${item.title}</div>
                <small style="color:var(--cyan);">${item.price.toLocaleString()} تومان</small>
            </div>
            <button onclick="removeFromCart(${index})" style="background:none;border:none;color:var(--danger)">✕</button>
        </div>
    `).join('') + `<div style="margin-top:15px;font-weight:700;">جمع کل: ${total.toLocaleString()} تومان</div>`;
}

function removeFromCart(index) {
    cart.splice(index, 1);
    updateCartUI();
}

// ثبت سفارش در دیتابیس
document.getElementById("submitOrderBtn").addEventListener("click", async () => {
    if (!currentUser) {
        showToast("لطفا ابتدا وارد حساب کاربری خود شوید.");
        document.getElementById("accountOverlay").classList.add("active");
        return;
    }
    if (cart.length === 0) return showToast("سبد خرید شما خالی است.");
    
    const telegram = document.getElementById("telegramHandleInput").value.trim();
    if (!telegram) return showToast("لطفا آیدی تلگرام خود را وارد کنید.");

    const totalPrice = cart.reduce((sum, item) => sum + item.price, 0);

    const { data, error } = await supabase.from('orders').insert([
        {
            user_id: currentUser.id,
            items: cart,
            total_price: totalPrice,
            telegram_handle: telegram,
            status: 'pending'
        }
    ]).select();

    if (error) {
        showToast("خطا در ثبت سفارش: " + error.message);
    } else {
        showToast("سفارش شما با موفقیت ثبت شد.");
        cart = [];
        updateCartUI();
        document.getElementById("cartDrawer").classList.remove("active");
        document.getElementById("cartOverlay").classList.remove("active");
        loadUserOrders();
    }
});

// =====================================================
// 4. ORDERS & REALTIME CHAT
// =====================================================
async function loadUserOrders() {
    if (!currentUser) return;
    
    const { data: orders, error } = await supabase
        .from('orders')
        .select('*')
        .eq('user_id', currentUser.id)
        .order('created_at', { ascending: false });

    const ordersList = document.getElementById("ordersList");
    if (error || !orders || orders.length === 0) {
        ordersList.innerHTML = "<p style='font-size:11px;color:var(--muted)'>سفارشی یافت نشد.</p>";
        return;
    }

    ordersList.innerHTML = orders.map(o => `
        <div onclick="selectOrderForChat('${o.id}')" style="padding:8px;border:1px solid var(--border);border-radius:5px;margin-bottom:5px;cursor:pointer;background:var(--card)">
            <small>کد: ${o.id.slice(0,8)} | وضعیت: <b style="color:var(--cyan)">${o.status}</b></small>
        </div>
    `).join('');
}

async function selectOrderForChat(orderId) {
    selectedOrderId = orderId;
    loadMessages(orderId);
    listenToChat(orderId);
}

async function loadMessages(orderId) {
    const { data: msgs } = await supabase
        .from('messages')
        .select('*')
        .eq('order_id', orderId)
        .order('created_at', { ascending: true });

    const chatLog = document.getElementById("chatLog");
    chatLog.innerHTML = msgs ? msgs.map(m => `
        <div class="chat-msg ${m.sender_type}">
            <b>${m.sender_type === 'customer' ? 'شما' : 'پشتیبانی'}:</b> ${m.content}
        </div>
    `).join('') : '';
    chatLog.scrollTop = chatLog.scrollHeight;
}

// چت زنده Realtime
function listenToChat(orderId) {
    if (chatSubscription) supabase.removeChannel(chatSubscription);

    chatSubscription = supabase
        .channel(`public:messages:order_id=eq.${orderId}`)
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `order_id=eq.${orderId}` }, payload => {
            loadMessages(orderId);
        })
        .subscribe();
}

document.getElementById("sendChatBtn").addEventListener("click", async () => {
    const input = document.getElementById("chatMsgInput");
    const content = input.value.trim();
    if (!content || !selectedOrderId || !currentUser) return;

    await supabase.from('messages').insert([
        {
            order_id: selectedOrderId,
            sender_id: currentUser.id,
            sender_type: 'customer',
            content: content
        }
    ]);

    input.value = "";
});

// =====================================================
// 5. EVENT LISTENERS
// =====================================================
document.getElementById("openCartBtn").addEventListener("click", () => {
    document.getElementById("cartDrawer").classList.add("active");
    document.getElementById("cartOverlay").classList.add("active");
});
document.getElementById("closeCartBtn").addEventListener("click", () => {
    document.getElementById("cartDrawer").classList.remove("active");
    document.getElementById("cartOverlay").classList.remove("active");
});
document.getElementById("cartOverlay").addEventListener("click", () => {
    document.getElementById("cartDrawer").classList.remove("active");
    document.getElementById("cartOverlay").classList.remove("active");
});

document.getElementById("openAccountBtn").addEventListener("click", () => {
    document.getElementById("accountOverlay").classList.add("active");
});
document.getElementById("closeAccountBtn").addEventListener("click", () => {
    document.getElementById("accountOverlay").classList.remove("active");
});

// Init Execution
checkUser();
loadProducts();
</script>
</body>
</html>
